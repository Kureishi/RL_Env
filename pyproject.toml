[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autorefine"
# SPEC.md 33.1 (C1): the single version source — must equal
# autorefine.__version__ (enforced by the A23 test); one step per round
# (v0.85 ⇒ 0.85.0, M88, SPEC.md 99)
version = "0.85.0"
description = "Environment for autonomous iterative ML model improvement"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
authors = [{ name = "Kurei" }]
license = { text = "MIT" }   # the LICENSE file at the repo root (SPEC 98.2)
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["streamlit>=1.30"]   # v0.9 dashboard (SPEC.md 23); core stays streamlit-free
image = ["Pillow>=9"]        # v0.10 ImageTask (SPEC.md 24.1); core stays PIL-free
audio = ["soundfile>=0.12"]  # v0.10 AudioTask MP3 (SPEC.md 24.1); WAV is stdlib
gpu = ["cupy-cuda12x>=13.0"]  # v0.77 optional GPU backend (SPEC.md 91.3); core stays GPU-free
video = ["imageio>=2.31"]     # v0.78 VideoTask (SPEC.md 92.6.1); core stays imageio-free

[project.scripts]
autorefine = "autorefine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
