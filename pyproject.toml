[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autorefine"
# SPEC.md 33.1 (C1): the single version source — must equal
# autorefine.__version__ (enforced by the A23 test); one step per round
# (v0.46 ⇒ 0.46.0, M49, SPEC.md 60)
version = "0.46.0"
description = "Environment for autonomous iterative ML model improvement"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["streamlit>=1.30"]   # v0.9 dashboard (SPEC.md 23); core stays streamlit-free
image = ["Pillow>=9"]        # v0.10 ImageTask (SPEC.md 24.1); core stays PIL-free
audio = ["soundfile>=0.12"]  # v0.10 AudioTask MP3 (SPEC.md 24.1); WAV is stdlib

[project.scripts]
autorefine = "autorefine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
